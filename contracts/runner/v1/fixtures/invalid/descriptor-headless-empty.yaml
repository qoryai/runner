# A headless section names at least one argument; an empty list says nothing.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
headless:
  args: []
rules:
  - source: output
    match: {type: result}
    type: ai.qory.session.result
    data:
      session_id: session_id
